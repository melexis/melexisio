; MLX90835 default transfer curves — fills the "Sensor version" list on
; mlx90835.html. To add a version, copy a section, rename it
; [PressureSensorInfo_<version>] and change the numbers; nothing else to edit.
;
; P1/P2            pressure in bar at the two ends of the curve
; Out1/Out2        pressure output in LSB at P1 and P2
; T1/T2            temperature in °C at the two ends of the curve
; TMED1/TMED2      media (NTC) temperature output in LSB at T1 and T2
; TDEV1/TDEV2      device temperature output in LSB at T1 and T2
; default_resolution  output width (bits) the LSB numbers above refer to.
;                  A chip configured for another width is shifted to this
;                  one before the curve is applied.

; The early sample on the bench (MLX90835GXP-AAA-001). Pressure is the
; default curve; the temperature curve is not from a datasheet but the
; formula that matched the bench (raw/32 - 73.15 °C at 12 bit: a chip at
; room temperature reads ~27 °C). The BAx curve puts the same chip at 136 °C.
; To be confirmed with the application engineer.
[PressureSensorInfo_AAA-001]
P1 = 0
P2 = 10
Out1 = 193
Out2 = 3896
T1 = -73.15
T2 = 54.85
TDEV1 = 0
TDEV2 = 4096
TMED1 = 0
TMED2 = 4096
default_resolution = 12

